name: Build & publish Docker image

# Publishes ghcr.io/cerase-ai/cerase-office-converter-mcp from this repo
# (canonical source). Tagging matches the platform convention:
#   - push to main           → main, latest, sha-<short>
#   - push of a `v*` git tag → vX.Y.Z, X.Y, latest
#   - pull_request           → build-only validation, no push
#   - workflow_dispatch      → manual trigger from the Actions UI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Serialise publishes per ref; cancel superseded branch builds (the newest
# push wins so an older in-flight build can't move :latest backwards). Tag
# builds are never cancelled — a release must complete.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io
  IMAGE: cerase-office-converter-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bootstrap auth: this GHCR package is still linked to cerase-core, so the
      # repo-scoped GITHUB_TOKEN gets 403 on push. Authenticate with an org-admin
      # PAT (GHCR_TOKEN secret) until the package grants this repo Write under
      # "Manage Actions access" — then revert to GITHUB_TOKEN and delete the secret.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata + tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=cerase-office-converter-mcp
            org.opencontainers.image.description=LibreOffice + pandoc + xelatex headless converter MCP
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
          provenance: false
